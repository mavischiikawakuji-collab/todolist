  hygiene:[],
  tasting:[],
  plate:[]
};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return{year:o.year||2026,month:o.month||10,data:o.data||JSON.parse(JSON.stringify(defaults))};}}catch(e){}return{year:2026,month:10,data:JSON.parse(JSON.stringify(defaults))};}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state));const s=document.getElementById('status');s.textContent='● 已儲存 '+new Date().toLocaleTimeString();setTimeout(()=>s.textContent='● 已自動儲存',2000);}
const metas={hygiene:{title:'📋 Hygiene Inspection Report',color:'#C7F0D6'},tasting:{title:'🍱 試食 Tasting - 可輸入試食項目',color:'#FFD6BA'},plate:{title:'🧫 抽板 Sampling - 可輸入抽板類型',color:'#BDE0FE'}};
let editing=null;

function render(){
  document.getElementById('yearInput').value=state.year;
  document.getElementById('monthInput').value=state.month;
  document.getElementById('title').textContent=`${state.year}年 ${state.month}月 工作清單`;
  const grid=document.getElementById('grid');grid.innerHTML='';
  Object.keys(metas).forEach(k=>{
    const meta=metas[k];const items=state.data[k];const done=items.filter(i=>i.done).length;
    const card=document.createElement('div');card.className='card' + (k==='plate' ? ' lg:col-span-2' : '');
        if(k==='plate'){
      card.innerHTML=`<div class="h-[44px] flex items-center justify-between px-4" style="background:${meta.color}"><span class="font-bold text-[14px]">${meta.title}</span><span class="text-[11px] px-2 py-1 rounded-full bg-white/70">${done}/${items.length} 完成</span></div><div id="list-${k}" class="grid grid-cols-1 lg:grid-cols-2"></div><div class="p-3 bg-[#FCFCFB] flex gap-2 border-t border-black/[0.04]"><input id="input-${k}" placeholder="新增分店..." class="flex-1 h-[36px] px-4 rounded-full border bg-white text-[13px] outline-none"><button data-add="${k}" class="h-[34px] w-[34px] flex items-center justify-center rounded-full bg-[#11181C] text-white text-[20px] font-[600] leading-none select-none" style="font-family:Arial, sans-serif">+</button></div>`;
    } else {
      card.innerHTML=`<div class="h-[44px] flex items-center justify-between px-4" style="background:${meta.color}"><span class="font-bold text-[14px]">${meta.title}</span><span class="text-[11px] px-2 py-1 rounded-full bg-white/70">${done}/${items.length}</span></div><div id="list-${k}" class="divide-y divide-black/[0.04]"></div><div class="p-3 bg-[#FCFCFB] flex gap-2"><input id="input-${k}" placeholder="新增分店..." class="flex-1 h-[36px] px-4 rounded-full border bg-white text-[13px] outline-none"><button data-add="${k}" class="h-[34px] w-[34px] flex items-center justify-center rounded-full bg-[#11181C] text-white text-[20px] font-[600] leading-none select-none" style="font-family:Arial, sans-serif">+</button></div>`;
    }
    grid.appendChild(card);
    const list=card.querySelector(`#list-${k}`);
    items.forEach(it=>{
      const row=document.createElement('div');row.className=`group flex items-center justify-between px-4 py-3 gap-2 border-b border-black/[0.04] last:border-b-0 ${it.done?'bg-[#F6F8F7]':''}`;
      const isEditing = editing && editing.key===k && editing.id===it.id;
      if(isEditing){
        if(k==='plate' || k==='tasting'){
          row.innerHTML=`<div class="flex flex-col gap-2 flex-1"><input id="editInput" class="inline-input flex-1" value="${it.label.replace(/"/g,'&quot;')}" placeholder="分店名"><input id="editDetail" class="inline-input flex-1 text-[12px]" value="${(it.detail||'').replace(/"/g,'&quot;')}" placeholder="${k==='tasting'?'輸入試食食物':'抽咩板？例如：麵板、飯板、手板'}"></div><div class="flex gap-1 self-start"><button data-saveedit="${k}|${it.id}" class="h-[26px] px-3 rounded-full bg-black text-white text-[12px]">儲存</button><button data-canceledit class="h-[26px] px-3 rounded-full bg-white border text-[12px]">取消</button></div>`;
        } else {
          row.innerHTML=`<div class="flex items-center gap-2 flex-1"><input id="editInput" class="inline-input flex-1" value="${it.label.replace(/"/g,'&quot;')}"></div><div class="flex gap-1"><button data-saveedit="${k}|${it.id}" class="h-[26px] px-3 rounded-full bg-black text-white text-[12px]">儲存</button><button data-canceledit class="h-[26px] px-3 rounded-full bg-white border text-[12px]">取消</button></div>`;
        }
      }else{
        if(k==='plate' || k==='tasting'){
          row.innerHTML=`<div class="flex items-center gap-3 flex-1 min-w-0"><button data-done="${k}|${it.id}" class="w-[22px] h-[22px] rounded-full border flex items-center justify-center shrink-0 ${it.done?'bg-black text-white border-black':'bg-white'}">${it.done?'✓':''}</button><div class="flex flex-col gap-1 min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="text-[13.5px] ${it.imp?'text-[#D90429] font-bold':''} ${it.done?'line-through opacity-50':''}">${it.label}</span>${it.imp?`<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#FFE5E5] text-[#D90429] border border-[#FFC9C9] font-bold">重點跟進</span>`:''}</div><div class="flex items-center gap-2"><input data-detail="${k}|${it.id}" class="h-[28px] px-3 rounded-full bg-[#F8F9FA] border border-black/5 text-[12px] w-full max-w-[500px] lg:max-w-[600px] focus:bg-white focus:border-black/20 outline-none" placeholder="${k==='tasting'?'輸入試食食物':'輸入要抽咩板...'}" value="${(it.detail||'').replace(/"/g,'&quot;')}"></div></div></div><div class="flex items-center gap-1 shrink-0"><button data-imp="${k}|${it.id}" class="h-[26px] px-2.5 rounded-full text-[11px] border ${it.imp?'bg-[#FFE5E5] text-[#D90429] border-[#FFC9C9]':'bg-white text-[#9AA0A6]'}">⚑ 重點</button><button data-edit="${k}|${it.id}" class="w-[26px] h-[26px] rounded-full bg-white border text-[#9AA0A6]">✎</button><button data-del="${k}|${it.id}" class="w-[26px] h-[26px] rounded-full bg-white border text-[#C2C8CC] hover:text-red-500">×</button></div>`;
        } else {
          row.innerHTML=`<div class="flex items-center gap-3 flex-1 min-w-0"><button data-done="${k}|${it.id}" class="w-[22px] h-[22px] rounded-full border flex items-center justify-center ${it.done?'bg-black text-white border-black':'bg-white'}">${it.done?'✓':''}</button><div class="flex items-center gap-2 flex-wrap"><span class="text-[13.5px] ${it.imp?'text-[#D90429] font-bold':''} ${it.done?'line-through opacity-50':''}">${it.label}</span>${it.sub?`<span class="text-[10px] px-1.5 py-0.5 rounded bg-[#F1F3F5] border">${it.sub}</span>`:''}${it.imp?`<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#FFE5E5] text-[#D90429] border border-[#FFC9C9] font-bold">重點跟進</span>`:''}</div></div><div class="flex items-center gap-1"><button data-imp="${k}|${it.id}" class="h-[26px] px-2.5 rounded-full text-[11px] border ${it.imp?'bg-[#FFE5E5] text-[#D90429] border-[#FFC9C9]':'bg-white text-[#9AA0A6]'}">⚑ 重點</button><button data-edit="${k}|${it.id}" class="w-[26px] h-[26px] rounded-full bg-white border text-[#9AA0A6]">✎</button><button data-del="${k}|${it.id}" class="w-[26px] h-[26px] rounded-full bg-white border text-[#C2C8CC] hover:text-red-500 hover:border-red-200">×</button></div>`;
        }
      }
      list.appendChild(row);
    });
  });
  bind();
}
function bind(){
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.done.split('|');state.data[k].find(x=>x.id===id).done=!state.data[k].find(x=>x.id===id).done;save();render();});
  document.querySelectorAll('[data-imp]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.imp.split('|');state.data[k].find(x=>x.id===id).imp=!state.data[k].find(x=>x.id===id).imp;save();render();});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.del.split('|');state.data[k]=state.data[k].filter(x=>x.id!==id);save();render();}); // 無confirm，直接刪
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.edit.split('|');editing={key:k,id:id};render(); setTimeout(()=>{const inp=document.getElementById('editInput'); if(inp){inp.focus(); inp.select();}},50);});
  document.querySelectorAll('[data-saveedit]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.saveedit.split('|');const inp=document.getElementById('editInput');const det=document.getElementById('editDetail');if(inp&&inp.value.trim()){state.data[k].find(x=>x.id===id).label=inp.value.trim();} if(det){state.data[k].find(x=>x.id===id).detail=det.value.trim();} editing=null;save();render();});
  document.querySelectorAll('[data-canceledit]').forEach(b=>b.onclick=()=>{editing=null;render();});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;const inp=document.getElementById('input-'+k);if(!inp.value.trim())return;const item={id:k+'_'+Date.now(),label:inp.value.trim(),done:false,imp:false,detail:''};state.data[k].push(item);inp.value='';save();render();});
  document.querySelectorAll('input[id^="input-"]').forEach(inp=>{inp.onkeydown=e=>{if(e.key==='Enter'){const k=inp.id.replace('input-','');if(!inp.value.trim())return;const newItem={id:k+'_'+Date.now(),label:inp.value.trim(),done:false,imp:false,detail:''}; state.data[k].push(newItem);inp.value='';save();render();}};});
  document.querySelectorAll('[data-detail]').forEach(inp=>{
    inp.onchange=e=>{const [k,id]=e.target.dataset.detail.split('|'); const it=state.data[k].find(x=>x.id===id); if(it){it.detail=e.target.value.trim(); save();}};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.target.blur();}}
  });
  const editInput=document.getElementById('editInput'); if(editInput){editInput.onkeydown=e=>{if(e.key==='Enter'){const btn=document.querySelector('[data-saveedit]'); if(btn)btn.click();} if(e.key==='Escape'){editing=null;render();}};}
}
document.getElementById('yearInput').onchange=e=>{state.year=parseInt(e.target.value)||2026;save();render();};
document.getElementById('monthInput').onchange=e=>{state.month=parseInt(e.target.value)||10;save();render();};
render();
</script>
</body>
</html>
